name: Daily Unicode Character

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package.json に書いた fontkit をインストール
      - name: Install dependencies
        run: npm install --package-lock=false

      # フォントを調べて、表示可能な文字＋SVG輪郭を生成
      - name: Generate daily characters
        env:
          FORCE_REGENERATE_CURRENT: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node scripts/generate-daily.js

      - name: Commit daily.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily.json

          if git diff --cached --quiet; then
            echo "daily.json is already up to date"
          else
            git commit -m "Update daily Unicode character"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
