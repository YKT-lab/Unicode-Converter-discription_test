name: Daily Unicode Character

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package.json に書いた fontkit をインストール
      - name: Install dependencies
        run: npm install --package-lock=false

      # 定時実行は、今まで通りの安定した日次処理
      - name: Generate scheduled daily characters
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: node scripts/generate-daily.js

      # 手動実行はテストモード。
      # 今日・明日を再抽選し、Unicode公式資料で審査し、
      # 合格した文字だけGeminiで日本語解説を生成する。
      - name: Generate 10 description test characters
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf '{"generatedAt":"","testOnly":true,"entries":[]}' > description-test.json

          for i in 1 2 3 4 5; do
            node scripts/generate-described-daily.js

            jq --slurpfile daily daily.json '
              .entries += [$daily[0].current, $daily[0].next]
              | .entries |= unique_by(.codePoint)
              | .entries |= .[:10]
              | .generatedAt = (now | todateiso8601)
              | .count = (.entries | length)
            ' description-test.json > description-test.tmp

            mv description-test.tmp description-test.json
          done

          git checkout -- daily.json

      - name: Build description test page
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/build-description-test.py

      - name: Commit daily.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily.json description-test.json description-test.html

          if git diff --cached --quiet; then
            echo "Generated JSON files are already up to date"
          else
            git commit -m "Update Unicode character data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
