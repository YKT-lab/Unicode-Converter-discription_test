name: Gemini Description Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gemini-description-test.yml"
      - "scripts/gemini-description.js"

permissions:
  contents: write

jobs:
  describe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate Japanese description
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/gemini-description.js

      - name: Commit description result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add description-test.json
          git commit -m "Add Gemini description test result" || exit 0
          git push
